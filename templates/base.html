<!DOCTYPE html>
<html lang="en" {% if g_info %}data-genre="{{ g_info.key }}"{% endif %}>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CineVault{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script>
    /* Apply saved theme before page renders — prevents flash */
    (function(){
      var t = localStorage.getItem('cv-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  {% block head %}{% endblock %}
</head>
<body>

<nav>
  <a href="{{ url_for('index') }}" class="logo">CineVault</a>
  <div class="nav-right">
    {% block nav_right %}
    <a href="{{ url_for('index') }}" class="nbtn">Home</a>
    {% endblock %}
    <button class="theme-toggle" id="themeToggle" title="Toggle theme" aria-label="Toggle light/dark mode">
      <span class="theme-icon theme-icon-dark">🌙</span>
      <span class="theme-icon theme-icon-light">☀️</span>
    </button>
    <a href="{{ url_for('logout') }}" class="theme-toggle" title="Lock vault" style="text-decoration:none;font-size:15px;">🔒</a>
  </div>
</nav>

<!-- PIN Settings Modal -->
<div class="lightbox" id="pinModal" style="display:none;">
  <div class="lightbox-inner" style="max-width:420px;">
    <button class="lightbox-close" onclick="document.getElementById('pinModal').style.display='none'">✕</button>
    <div style="padding:32px 28px;">
      <h3 style="font-family:var(--serif);font-size:22px;margin-bottom:20px;">🔐 PIN Settings</h3>

      <form method="POST" action="/change-pin" style="display:flex;flex-direction:column;gap:10px;margin-bottom:24px;">
        <label style="font-size:11px;letter-spacing:1px;color:var(--muted);">CURRENT PIN</label>
        <input type="password" name="current_pin" placeholder="Current PIN" maxlength="8"
          style="background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-family:var(--sans);font-size:14px;outline:none;">
        <label style="font-size:11px;letter-spacing:1px;color:var(--muted);margin-top:6px;">NEW PIN</label>
        <input type="password" name="new_pin" placeholder="New PIN (min 4 digits)" maxlength="8"
          style="background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-family:var(--sans);font-size:14px;outline:none;">
        <button type="submit" style="margin-top:6px;padding:10px;border-radius:8px;border:none;background:linear-gradient(135deg,#A66CFF,#FF6B9D);color:#fff;font-family:var(--sans);font-weight:700;font-size:13px;cursor:pointer;">Change PIN</button>
      </form>

      <form method="POST" action="/remove-pin" style="display:flex;flex-direction:column;gap:10px;">
        <label style="font-size:11px;letter-spacing:1px;color:var(--muted);">REMOVE PIN PROTECTION</label>
        <input type="password" name="current_pin" placeholder="Enter current PIN to remove"  maxlength="8"
          style="background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-family:var(--sans);font-size:14px;outline:none;">
        <button type="submit" style="padding:10px;border-radius:8px;border:1px solid rgba(232,69,69,0.3);background:rgba(232,69,69,0.1);color:#FF6B6B;font-family:var(--sans);font-weight:700;font-size:13px;cursor:pointer;">Remove PIN</button>
      </form>
    </div>
  </div>
</div>

{% block body %}{% endblock %}

<footer>
  <span class="footer-logo">CineVault</span>
  <nav class="footer-links">
    {% for genre in genres %}
    <a href="{{ url_for('genre_page', genre_key=genre.key) }}"
       {% if g_info and g_info.key == genre.key %}style="color:var(--accent)"{% endif %}>
      {{ genre.label }}
    </a>
    {% endfor %}
  </nav>
  <span class="footer-copy">© 2025 CineVault. All rights reserved.</span>
</footer>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <div class="lightbox-inner" style="max-width:1000px;">
    <button class="lightbox-close" onclick="closeLightbox()">✕</button>
    <div id="lbContent"></div>
    <div class="lightbox-body">
      <div class="lightbox-title" id="lbTitle"></div>
      <div class="lightbox-meta" id="lbMeta"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
